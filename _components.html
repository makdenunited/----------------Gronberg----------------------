<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:200,300,regular,500,600,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>components</title>
  </head>
  <body>
    <!-- Обертка враппер.Решает кучу проблем(с горизонт.скроллом, с прижимание футера к подвалу страницы и т.д.) -->
    <div class="wrapper">
      <div class="components">
        <div class="components__container">
          <!-- ......................................................КНОПКА......................................................-->

          <a href="" class="button">
            button
            <svg
              width="32"
              height="15"
              viewBox="0 0 32 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M0 7.35352H30" />
              <path d="M23.5 0.353516L30.5 7.35352L23.5 14.3535" />
            </svg>
          </a>
          <!-- ...................................................................................................................... -->

          <!-- ....................................................КНОПКА-СТРЕЛКА ......................................................-->

          <a href="" class="arrow-link"
            >Arrow right
            <svg
              width="32"
              height="15"
              viewBox="0 0 32 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M0 7.35352H30" />
              <path d="M23.5 0.353516L30.5 7.35352L23.5 14.3535" />
            </svg>
          </a>
          <!-- .......................................................кнопка стрелка влево............................................ -->

          <a href="" class="arrow-link arrow-link--left"
            >Arrow left
            <svg
              width="32"
              height="15"
              viewBox="0 0 32 15"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M0 7.35352H30" />
              <path d="M23.5 0.353516L30.5 7.35352L23.5 14.3535" />
            </svg>
          </a>
          <!-- .............................................стрелка диагональ.................................................. -->
          <a href="" class="arrow-link arrow-link--dark"
            >Buy Ticket
            <svg
              width="21"
              height="21"
              viewBox="0 0 21 21"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M4.94971 15.9099L15.5563 5.30326" />
              <path d="M6.01025 4.9499H15.9097V14.8494" />
            </svg>
          </a>
          <!-- ............................................ -->

          <!-- Заголовок секции -->

          <div class="block-header">
            <div class="block-header__title">Latest <span>Work</span></div>
            <a href="" class="block-header__link arrow-link"
              >View All
              <svg
                width="32"
                height="15"
                viewBox="0 0 32 15"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path d="M0 7.35352H30" />
                <path d="M23.5 0.353516L30.5 7.35352L23.5 14.3535" /></svg></a>
          </div>
<!-- ................................................................ -->


          <!-- s...............ocial media........... -->

                      <ul class="social">
              <li class="social__item">
                <a href="" class="social__link" target="_blank">Twitter</a>
              </li>
              <li class="social__item">
                <a href="" class="social__link" target="_blank">Instagram</a>
              </li>
              <li class="social__item">
                <a href="" class="social__link" target="_blank">Facebook</a>
              </li>
            </ul>
            <!-- ............................ .........-->
        </div>
      </div>
    </div>
  </body>
</html>
